name: Python CI

on:
  push:
    branches: ["main"]

jobs:
  run-python:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run script
        run: python hello.py
